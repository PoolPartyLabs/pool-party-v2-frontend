allowBuilds:
  sharp: true
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  '@reown/appkit': true
  bufferutil: true
  keccak: true
  utf-8-validate: true
  # @sentry/cli ships its binary as per-platform `optionalDependencies` that pnpm installs from the
  # lockfile with no script; its postinstall is only a CDN-download fallback. `false` records the
  # decision and silences ERR_PNPM_IGNORED_BUILDS (same setting as the private repository).
  '@sentry/cli': false
verifyDepsBeforeRun: false

# Security patches for transitive packages pinned below their upstream fixes.
# Keep ranges narrow: platform majors and wallet SDK APIs remain unchanged.
overrides:
  'axios@>=1.0.0 <1.18.0': 1.18.0
  'brace-expansion@>=5.0.0 <5.0.9': 5.0.9
  'browserslist@>=4.0.0 <4.28.7': 4.28.7
  'fast-uri@>=3.0.0 <3.1.6': 3.1.6
  'form-data@>=4.0.0 <4.0.6': 4.0.6
  'hono@>=4.0.0 <4.13.5': 4.13.5
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'nanoid@>=3.0.0 <3.3.18': 3.3.18
  'postcss@>=8.0.0 <8.5.23': 8.5.23
  'socket.io-parser@>=4.0.0 <4.2.7': 4.2.7
  'undici@>=7.0.0 <7.29.0': 7.29.0
  'vite@>=8.0.0 <8.0.16': 8.0.16
  'ws@>=8.0.0 <8.21.0': 8.21.0
  # Legacy development tooling pulled in by the Uniswap SDK. These patched
  # versions retain the specific CommonJS APIs its existing callers use.
  'hardhat@2>adm-zip': 0.6.0
  'hardhat@2>undici': 6.28.0
  'mocha@10>serialize-javascript': 7.0.5
  'solc@0.8.26>tmp': 0.2.7
