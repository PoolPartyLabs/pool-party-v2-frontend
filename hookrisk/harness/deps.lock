# hookrisk Solidity dependency lock
#
# Format: <dir> <url> <commit>
#
# We pin commits rather than use git submodules on purpose. The harness is one
# surface of a four-surface monorepo that also has to be publishable standalone,
# and submodules make `git subtree split` produce a repository whose .gitmodules
# paths no longer resolve. A flat lockfile is reproducible, reviewable in a diff,
# and lets `make deps` work identically inside and outside CI.
#
# Refresh with `make deps-update`, which rewrites the commit column from the
# `ref` comment beside each entry and leaves a diff for review.

